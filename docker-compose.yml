services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clientflow
      POSTGRES_PASSWORD: clientflow
      POSTGRES_DB: clientflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://clientflow:clientflow@db:5432/clientflow
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY, e.g. export SECRET_KEY=$(openssl rand -hex 32)}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
